name: demo_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  retrofit: ^4.4.1
  dio: ^5.7.0
  dio_http_formatter: ^3.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.11
  google_sign_in: ^7.2.0
  multiple_result: ^5.1.0
  gap: ^3.0.1
  window_manager: ^0.5.1
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.1
  image_cropper: ^12.1.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.1
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  flutter_gen_runner: ^5.8.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-Bold.ttf
          weight: 700
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_thai/NotoSansThai-Light.ttf
          weight: 300
